<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Tra Cứu Diện Chẩn Toàn Diện</title>
    <style>
        :root {
            --primary-color: #8b0000;
            --primary-hover: #a00000;
            --secondary-color: #d9534f;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
            --warning-bg: #fff3cd;
            --warning-text: #856404;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            padding: 20px;
            background: var(--primary-color);
            color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 14px;
            opacity: 0.9;
        }

        /* Tab Navigation */
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        .tab-btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            background: #e9ecef;
            color: #495057;
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            background: #dee2e6;
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Controls / Search Controls */
        .search-box {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            transition: border 0.3s ease;
        }

        select:focus, input[type="text"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 5px rgba(139, 0, 0, 0.2);
        }

        /* Detail Card Layout */
        .card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 5px solid var(--primary-color);
        }

        .card h2 {
            color: var(--primary-color);
            font-size: 20px;
            margin-bottom: 12px;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }

        .card-section {
            margin-bottom: 12px;
        }

        .card-section strong {
            color: #111;
            display: inline-block;
            min-width: 140px;
        }

        .badge-huyet {
            display: inline-block;
            background: #f8d7da;
            color: #721c24;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            margin: 2px;
            font-size: 14px;
        }

        .warning-box {
            background-color: var(--warning-bg);
            color: var(--warning-text);
            padding: 10px 15px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 14px;
            border-left: 4px solid #ffc107;
        }

        /* Grid Layout for Huyệt Cards */
        .huyet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .source-tag {
            font-size: 12px;
            color: #6c757d;
            font-style: italic;
            margin-top: 10px;
            display: block;
        }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .nav-tabs { flex-direction: column; }
            .tab-btn { border-radius: 6px; }
        }
    </style>
</head>

// =========================================================================
// 3. LOGIC XỬ LÝ GIAO DIỆN (JavaScript Functions)
// =========================================================================

// Khởi tạo dữ liệu khi trang tải xong
window.onload = function() {
    initBenhDropdown();
    renderHuyetGrid(dataHuyet);
};

// Chuyển đổi qua lại giữa các Tab
function switchTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

    if(tabId === 'tab-benh') {
        document.querySelectorAll('.tab-btn').classList.add('active');
        document.getElementById('tab-benh').classList.add('active');
    } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-huyet').classList.add('active');
    }
}

// Nạp danh sách bệnh vào Select dropdown
function initBenhDropdown() {
    const select = document.getElementById('selectBenh');
    dataBenh.forEach(benh => {
        const option = document.createElement('option');
        option.value = benh.id;
        option.textContent = `[${benh.nhom}] ${benh.ten}`;
        select.appendChild(option);
    });
}

// Hiển thị chi tiết bệnh được chọn
function renderBenhDetail() {
    const selectValue = document.getElementById('selectBenh').value;
    const container = document.getElementById('benhDetailContainer');

    if (!selectValue) {
        container.innerHTML = `<div class="card" style="text-align: center; color: #666; padding: 40px;">👈 Vui lòng chọn một bệnh từ danh sách ở trên để xem chi tiết phác đồ và kỹ thuật điều trị.</div>`;
        return;
    }

    const benh = dataBenh.find(b => b.id === selectValue);
    if (benh) {
        container.innerHTML = `
            <div class="card">
                <h2>📋 ${benh.ten}</h2>
                <div class="card-section"><strong>Nhóm bệnh:</strong> ${benh.nhom}</div>
                <div class="card-section"><strong>Triệu chứng nhận biết:</strong> ${benh.trieuChung}</div>
                <div class="card-section">
                    <strong>Phác đồ / Bộ huyệt:</strong> 
                    <span style="color: var(--primary-color); font-weight: bold;">${benh.phacDo}</span>
                </div>
                <div class="card-section"><strong>Kỹ thuật & Thủ pháp:</strong> ${benh.kyThuat}</div>
                <div class="card-section"><strong>Lời khuyên & Kiêng cữ:</strong> ${benh.loiKhuyen}</div>
                <span class="source-tag">📖 Nguồn tài liệu: ${benh.nguon}</span>
            </div>
        `;
    }
}

// Hiển thị danh sách thẻ Huyệt
function renderHuyetGrid(list) {
    const container = document.getElementById('huyetGridContainer');
    if (list.length === 0) {
        container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 30px; color: #777;">Không tìm thấy huyệt đạo phù hợp với từ khóa tìm kiếm.</div>`;
        return;
    }

    container.innerHTML = list.map(h => `
        <div class="card" style="margin-bottom: 0;">
            <h2>📌 ${h.ten}</h2>
            <div class="card-section"><strong>Vị trí định vị:</strong> ${h.viTri}</div>
            <div class="card-section"><strong>Tác dụng trị liệu:</strong> ${h.tacDung}</div>
            <div class="card-section"><strong>Bệnh liên quan:</strong> ${h.benhLienQuan}</div>
            ${h.canhBao ? `<div class="warning-box"><strong>Cảnh báo / Chống chỉ định:</strong> \${h.canhBao}</div>` : ''}
            <span class="source-tag">💡 Lưu ý: ${h.luuY}</span>
        </div>
    `).join('');
}

// Lọc tìm kiếm huyệt theo từ khóa
function filterHuyet() {
    const keyword = document.getElementById('inputHuyet').value.toLowerCase().trim();
    const filtered = dataHuyet.filter(h => 
        h.so.toLowerCase().includes(keyword) ||
        h.ten.toLowerCase().includes(keyword) ||
        h.viTri.toLowerCase().includes(keyword) ||
        h.tacDung.toLowerCase().includes(keyword) ||
        h.benhLienQuan.toLowerCase().includes(keyword)
    );
    renderHuyetGrid(filtered);
}
